name: Run Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { elixir: "1.20", otp: "29" }
          - { elixir: "1.19", otp: "28" }
          - { elixir: "1.18", otp: "27" }

    steps:
      - uses: actions/checkout@v7
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.otp }}-${{ matrix.elixir }}-
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run tests
        run: mix test

  # Boots examples/flower_shop and runs the official UCP conformance suite
  # against it. The suite is Python; uv installs it from PyPI at the commit
  # pinned in bin/conformance.
  conformance:
    runs-on: ubuntu-latest
    name: UCP conformance suite
    defaults:
      run:
        working-directory: examples/flower_shop
    env:
      PORT: "8182"
      SIMULATION_SECRET: super-secret-sim-key

    steps:
      - uses: actions/checkout@v7
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Restore example caches
        uses: actions/cache@v6
        with:
          path: |
            examples/flower_shop/deps
            examples/flower_shop/_build
          # No prefix fallback: bazaar is a path dep with modules compiled only
          # when optional deps are present, and a stale _build keeps their absence.
          key: ${{ runner.os }}-flower-shop-${{ hashFiles('mix.lock', 'examples/flower_shop/mix.lock') }}
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run example tests
        run: mix test
      - name: Start the flower shop
        run: |
          mkdir -p tmp
          mix run --no-halt > tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "http://localhost:$PORT/.well-known/ucp" > /dev/null && exit 0
            sleep 1
          done
          echo "server did not come up"; cat tmp/server.log; exit 1
      - name: Run the conformance suite
        run: bin/conformance
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: flower-shop-server-log
          path: examples/flower_shop/tmp/server.log
